apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: task-manager
  labels:
    app: api
    app.kubernetes.io/part-of: task-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: task-manager
    spec:
      containers:
        - name: api
          # built from app/backend/Dockerfile — push it to a registry, or load it
          # into a local cluster (kind load docker-image / minikube image load)
          image: aledanee/task-manager-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: task-manager-db
                  key: CONNECTION_STRING
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
