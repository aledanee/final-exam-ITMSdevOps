apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: task-manager
  labels:
    app: api
    app.kubernetes.io/part-of: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: task-manager
    spec:
      containers:
        - name: api
          # built from app/backend/Dockerfile — push it to a registry, or load it
          # into a local cluster (kind load docker-image / minikube image load)
          image: aledanee/task-manager-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: task-manager-db
                  key: CONNECTION_STRING
          # startupProbe: gate the two probes below until the app has finished booting.
          # The DB bootstrap loop waits up to 12 x 5s = 60s (Program.cs), so without this
          # gate the liveness probe (15s delay + 3 x 15s = 60s) killed the container at
          # exactly the moment it was about to become ready — observed as repeated kills.
          # While startupProbe is failing, readiness/liveness are NOT executed.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24        # up to 120s to reach /health before we judge it
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            # default timeoutSeconds is 1s; under load /health can miss it while the
            # container is CPU-throttled, which drops the pod out of Endpoints and gets
            # requests refused (connection reset, no response at all).
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6         # 90s of tolerance before a restart (was 45s)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
