apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: task-manager
  labels:
    app: api
    app.kubernetes.io/part-of: task-manager
spec:
  # NodePort so the API is reachable on any cluster (cloud or local, e.g. kind/minikube)
  type: NodePort
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
