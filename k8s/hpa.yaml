# Autoscales the stateless API on CPU utilization.
# Requires metrics-server (minikube: `minikube addons enable metrics-server`).
# CPU % is measured against the container's cpu request (100m), so 60% = 60m.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: task-manager
  labels:
    app: api
    app.kubernetes.io/part-of: task-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0      # react immediately to a spike
    scaleDown:
      stabilizationWindowSeconds: 300    # but don't thrash: wait 5 idle minutes
