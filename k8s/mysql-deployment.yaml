apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: task-manager
  labels:
    app: mysql
    app.kubernetes.io/part-of: task-manager
spec:
  replicas: 1
  # Recreate: the RWO volume must not be mounted by two pods during a rollout
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/part-of: task-manager
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            # the official MySQL image creates the database/user on first boot
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-manager-db
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: task-manager-db
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: task-manager-db
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-manager-db
                  key: MYSQL_PASSWORD
          # MySQL's default max_connections is 151, but 6 API pods using the driver's
          # default pool (100/pod) = up to 600 claimants. Measured during load testing:
          #   Max_used_connections 152 · Threads_connected 152 · Aborted_connects 573
          #   MySqlException "Too many connections" at Program.cs:32 (a pod couldn't boot)
          # The API side is capped at Maximum Pool Size=20 -> 6 x 20 = 120 < 500 here.
          args: ["--max_connections=500"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
