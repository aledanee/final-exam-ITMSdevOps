# Sensitive values live in a Secret, not in the Deployment spec.
# stringData is plaintext on apply; in production use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-db
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/part-of: task-manager
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: taskdb
  MYSQL_USER: taskuser
  MYSQL_PASSWORD: taskpass
  # consumed by the API container (ConnectionStrings__DefaultConnection)
  CONNECTION_STRING: "Server=mysql;Port=3306;Database=taskdb;User=taskuser;Password=taskpass;AllowPublicKeyRetrieval=True;SslMode=None;"
