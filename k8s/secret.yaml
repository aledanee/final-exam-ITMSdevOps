# Sensitive values live in a Secret, not in the Deployment spec.
# stringData is plaintext on apply; in production use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-db
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager
    app.kubernetes.io/part-of: task-manager
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: taskdb
  MYSQL_USER: taskuser
  MYSQL_PASSWORD: taskpass
  # consumed by the API container (ConnectionStrings__DefaultConnection)
  # Maximum Pool Size=20 caps this pod's share of MySQL connections: with max_connections=500
  # on the server, 6 pods x 20 = 120 always fits, so a restarting pod can never be refused.
  CONNECTION_STRING: "Server=mysql;Port=3306;Database=taskdb;User=taskuser;Password=taskpass;AllowPublicKeyRetrieval=True;SslMode=None;Maximum Pool Size=20;"
